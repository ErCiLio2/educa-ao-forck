[databases]
educa = host=postgres port=5432 dbname=educa

[pgbouncer]
listen_addr      = 0.0.0.0
listen_port      = 5432
auth_type        = md5
auth_file        = /etc/pgbouncer/userlist.txt
pool_mode        = transaction
max_client_conn  = 100
default_pool_size = 20
log_connections  = 0
log_disconnections = 0
